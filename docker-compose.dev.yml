services:
  db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER:-pocketkeeper_db_container}_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # проброшен наружу, чтобы можно было подключиться локальным psql/DBeaver
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  # Прогонять вручную для dev: docker compose -f docker-compose.dev.yml run --rm migrate
  migrate:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - .:/app
      - venv_dev:/app/.venv
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
    profiles:
      - tools

  app:
    build:
      context: .
      target: development
    container_name: pocketkeeper_app_dev
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # именованный volume поверх .venv не даёт bind mount репозитория
      # затереть зависимости, установленные внутри образа
      - venv_dev:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

volumes:
  db_data_dev:
    driver: local
  venv_dev:
    driver: local

networks:
  app:
    driver: bridge
